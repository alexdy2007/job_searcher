services:
  db:
    image: postgres:17
    container_name: job_searcher_db
    environment:
      POSTGRES_USER: job_searcher
      POSTGRES_PASSWORD: job_searcher
      POSTGRES_DB: job_searcher
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_searcher -d job_searcher"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
