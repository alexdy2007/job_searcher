[project]
name = "job-searcher"
version = "0.1.0"
description = "Aggregate job listings from ATS boards and company career pages into Postgres"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.69",
    "httpx>=0.28",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "selectolax>=0.3.27",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.41",
    "structlog>=24.4",
    "tenacity>=9.0",
    "trafilatura>=2.0",
    "typer>=0.15",
]

[project.optional-dependencies]
js = ["playwright>=1.49"]

[project.scripts]
job-searcher = "job_searcher.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_searcher"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Autogenerated by Alembic. Reformatting them obscures the diff against what
# autogenerate actually produced, which is exactly what a reviewer needs to see.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: hits the real Anthropic API; deselected unless --llm is passed",
    "db: requires a running Postgres",
]
